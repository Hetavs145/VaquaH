apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: vaquah
spec:
  selector:
    app: vaquah-backend
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vaquah
spec:
  selector:
    app: vaquah-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: scaler-agent
  namespace: vaquah
spec:
  selector:
    app: vaquah-scaler-agent
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
---
# External access — use NodePort for VPS, LoadBalancer for cloud
apiVersion: v1
kind: Service
metadata:
  name: vaquah-ingress
  namespace: vaquah
spec:
  selector:
    app: vaquah-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
