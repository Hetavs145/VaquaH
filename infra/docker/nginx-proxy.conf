upstream backend_pool {
    # Docker Compose DNS resolves "backend" to all replica IPs
    # least_conn picks the replica with fewest active connections
    least_conn;
    server backend:5001;
}

server {
    listen 80;
    server_name _;

    # Frontend (static SPA)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — load-balanced across replicas
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for LLM/TTS calls
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Upload size for STT audio
        client_max_body_size 10m;
    }

    # Agent dashboard
    location /agent/ {
        proxy_pass http://scaler-agent:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
