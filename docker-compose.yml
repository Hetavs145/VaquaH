services:
  # ── Nginx Reverse Proxy / Load Balancer ──
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Vite build → Nginx) ──
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_API_BASE_URL: /api
    expose:
      - "80"
    restart: unless-stopped

  # ── Backend API (scalable replicas) ──
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - backend/.env
    expose:
      - "5001"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  # ── AI Scaler Agent (LangGraph) ──
  scaler-agent:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.agent
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DOCKER_MODE=compose
      - COMPOSE_PROJECT=vaquah-main
      - BACKEND_SERVICE=backend
      - BACKEND_HEALTH_URL=http://backend:5001/api/health/detailed
      - MIN_REPLICAS=1
      - MAX_REPLICAS=4
      - CHECK_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "8090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
